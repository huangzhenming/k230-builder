name: Regression

# Full regression pipeline on the self-hosted runner (label: k230-builder):
#   image -> smoke -> unit -> toolchains -> sdk-{linux,rtos,nuttx}
#         -> nncase-{compiler,kmodel,runtime-rtos,runtime-linux,runtime-nuttx}
# Runs automatically whenever main actually gains a new commit (PR merge,
# squash, or otherwise) — a `push` trigger rather than `pull_request`, so a
# fork's PR branch never runs on this self-hosted runner until a maintainer
# has merged it. Also invoked as a reusable workflow from release.yml on tag
# push, and available via workflow_dispatch for ad hoc runs.
# tests/report.sh writes a Markdown report to the job summary + reports/.
# Runner setup & tests/ci.env: see tests/README.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stages:
        description: 'stages to run, space-separated (empty = all), e.g. "toolchains sdk-nuttx"'
        required: false
        default: ''
  workflow_call:
    inputs:
      stages:
        description: 'stages to run, space-separated (empty = all), e.g. "toolchains sdk-nuttx"'
        required: false
        default: ''
        type: string

jobs:
  regression:
    runs-on: [self-hosted, k230-builder]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      # actions/checkout does `git clean -ffdx` before every checkout, which
      # wipes gitignored files — so tests/ci.env can't just live in the repo
      # checkout across runs. Keep the real copy outside any checkout, at the
      # runner install dir. $RUNNER_WORKSPACE is <runner-root>/_work/<repo>,
      # so the runner root is two levels up.
      - name: stage tests/ci.env
        run: cp "${RUNNER_WORKSPACE}/../../ci.env" tests/ci.env

      - name: regression pipeline + report
        run: bash tests/report.sh ${{ inputs.stages }}

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_number }}
          path: |
            reports/latest.md
            reports/latest-logs/
          if-no-files-found: warn
