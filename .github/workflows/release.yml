name: Release

# Tag push (v*): regression must pass before anything ships.
#   regression (self-hosted k230-builder, full stages)
#     -> release (build+push ghcr.io image, cut GitHub Release)
#     -> kendryte (self-hosted kendryte: mirror image, persist k230 launcher)
# workflow_dispatch skips regression and only builds/pushes a `dev` image —
# no GitHub Release, no kendryte mirroring.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  regression:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/regression.yml

  release:
    needs: regression
    if: always() && (needs.regression.result == 'success' || needs.regression.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  kendryte:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, kendryte]

    steps:
      - uses: actions/checkout@v4

      - name: mirror image to registry.kendryte.com
        run: |
          SRC="ghcr.io/${{ github.repository }}"
          DST="registry.kendryte.com/k230-builder"
          for tag in "${{ github.ref_name }}" latest; do
            docker pull "${SRC}:${tag}"
            docker tag "${SRC}:${tag}" "${DST}:${tag}"
            docker push "${DST}:${tag}"
          done

      # actions/checkout does `git clean -ffdx` before every checkout, which
      # would wipe this on the next run — persist it one level above the
      # runner workspace (same trick as tests/ci.env in regression.yml) so
      # it survives across runs for users pulling the launcher from here.
      - name: persist k230 launcher script
        run: |
          cp k230 "${RUNNER_WORKSPACE}/../../k230"
          chmod +x "${RUNNER_WORKSPACE}/../../k230"
