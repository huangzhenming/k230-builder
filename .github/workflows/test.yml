name: Test

# Per-commit functional gate for k230-builder.
#   T0 static : bash -n, shellcheck, hadolint (advisory), resolve_profile unit tests
#   T1 smoke  : build the image + assert bundled tools & profile resolution
# Heavy SDK builds (Linux/rt-smart full compiles) are intentionally out of scope
# here — they need a self-hosted runner / toolchain cache (see a future T2/T3).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax)
        run: |
          for f in k230 build.sh install.sh \
                   scripts/entrypoint.sh scripts/toolchain.sh scripts/profile.sh \
                   scripts/env.sh scripts/download-toolchains scripts/list-toolchains \
                   tests/run.sh tests/smoke.sh; do
            echo "bash -n $f"; bash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # SC1091: don't fail on sources it can't follow (e.g. /usr/local/bin/*.sh)
          shellcheck -S warning -e SC1091 \
            k230 build.sh install.sh \
            scripts/entrypoint.sh scripts/toolchain.sh scripts/profile.sh \
            scripts/env.sh scripts/download-toolchains scripts/list-toolchains \
            tests/run.sh tests/smoke.sh

      - name: hadolint (advisory)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
        continue-on-error: true

      - name: resolve_profile unit tests
        run: bash tests/run.sh

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image (load locally)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: k230-builder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: bash tests/smoke.sh k230-builder:ci
